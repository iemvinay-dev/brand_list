<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ABeeZee&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e5e5e5; --hero:#e1ad01; --fg:#000; --tile:#fff; --ink:#111; --muted:#555; --accent:#f5a623; --border:#d9d9d9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"ABeeZee", system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:clamp(2.2rem, 7vw, 3.6rem); text-align:center; margin:0 0 10px; font-weight:400; }
  .sub { text-align:center; color:var(--fg); font-size:clamp(1.1rem, 3.4vw, 1.6rem); margin:0 auto 28px; max-width:30ch; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  @media (min-width:700px)  { .grid { grid-template-columns:repeat(3,1fr); gap:24px; } }
  @media (min-width:1000px) { .grid { grid-template-columns:repeat(4,1fr); } }
  .tile { background:var(--tile); border:1px solid var(--border); border-radius:28px; aspect-ratio:1/1; width:100%; display:flex;
          flex-direction:column; align-items:center; justify-content:center; padding:18px; gap:10px;
          color:var(--ink); font:inherit; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .tile:hover { transform:scale(1.03); box-shadow:0 6px 18px rgba(0,0,0,.12); }
  .tile:active { transform:scale(.98); }
  .tile:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .logo { display:flex; align-items:center; justify-content:center; width:100%; flex:1; min-height:0; }
  .logo img { max-width:80%; max-height:100%; object-fit:contain; }
  .tile .name { font-size:1.15rem; font-weight:700; text-align:center; }
  .logo img + .name { display:none; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  /* Header: search + banners */
  .hero { background:var(--hero); padding-top:16px; }
  .hero-in { max-width:900px; margin:0 auto; padding:0 16px; }
  .search { display:flex; align-items:center; gap:12px; background:#fff; border-radius:999px; padding:0 20px; height:56px; }
  .sbtn { border:0; background:none; padding:6px; margin:0 -6px 0 -6px; display:flex; flex:none; cursor:pointer; border-radius:50%; }
  .sbtn:hover { background:rgba(0,0,0,.06); }
  .sbtn svg { width:24px; height:24px; }
  @keyframes sblink { 0%,100% { background:transparent; transform:scale(1); } 50% { background:#ffc83d; transform:scale(1.3); } }
  .sbtn.blink { animation:sblink .45s ease-in-out 3; }
  .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:1.1rem; color:#111; height:100%; }
  .search input::placeholder { color:#222; opacity:1; }
  .search input::-webkit-search-cancel-button { display:none; }
  .promo { display:block; margin-top:14px; border-radius:14px; overflow:hidden; }
  .promo svg { display:block; width:100%; height:auto; }
  .carousel { margin:16px -16px 0; }
  .track { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 16px; scroll-padding-left:16px;
           scrollbar-width:none; position:relative; }
  .track::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 min(88%, 640px); aspect-ratio:2.5/1; border-radius:18px; overflow:hidden; scroll-snap-align:start;
           display:flex; flex-direction:column; justify-content:center; padding:5% 6%; color:#fff; text-decoration:none; }
  .slide img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .slide h2 { margin:0 0 8px; font-size:clamp(1.05rem, 4vw, 1.7rem); max-width:16ch; line-height:1.2; }
  .slide p { margin:0; font-weight:700; background:#ffc83d; color:#222; align-self:flex-start; padding:4px 12px; border-radius:6px; font-size:clamp(.8rem, 2.6vw, 1rem); }
  .vp { position:relative; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:38px; height:38px; border-radius:50%; border:0; padding:0;
         background:rgba(255,255,255,.92); box-shadow:0 2px 8px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .nav:hover { background:#fff; }
  .nav:active { transform:translateY(-50%) scale(.94); }
  .nav svg { width:20px; height:20px; }
  .nav.prev { left:22px; }
  .nav.next { right:22px; }
  .dots { display:flex; justify-content:center; gap:10px; margin-top:14px; }
  .dot { width:12px; height:12px; border-radius:50%; border:0; padding:0; background:rgba(0,0,0,.28); cursor:pointer; }
  .dot.on { background:#fff; }
  .promo, .slide { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; pointer-events:none; cursor:default; }
  .slide img { -webkit-user-drag:none; }
  h1, .sub { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; pointer-events:none; cursor:default; }
  /* Category tabs */
  .cat-sec { margin:8px 0 26px; }
  .cat-title { display:flex; align-items:center; gap:12px; margin:0 0 12px 4px; font-size:clamp(1rem, 3.6vw, 1.35rem); font-weight:700; }
  .cat-title { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; pointer-events:none; cursor:default; }
  .cat-title svg { width:38px; height:30px; flex:none; fill:none; stroke:#111; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .cat-row { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:6px 4px 14px; margin:0 -4px; scrollbar-width:none; }
  .cat-row::-webkit-scrollbar { display:none; }
  .cat { flex:0 0 min(46%, 250px); scroll-snap-align:start; background:#fff; border:0; border-radius:16px; padding:0; overflow:hidden;
         box-shadow:0 2px 8px rgba(0,0,0,.18); cursor:pointer; font:inherit; color:#111; text-align:center; transition:transform .15s; }
  button, .chip { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  button img { -webkit-user-drag:none; pointer-events:none; }
  .cat { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  .cat img { -webkit-user-drag:none; pointer-events:none; }
  .cat:hover { transform:translateY(-2px); }
  .cat.on { outline:3px solid var(--hero); outline-offset:2px; }
  .cat .ci { aspect-ratio:1.72/1; display:flex; align-items:center; justify-content:center; font-size:clamp(2.4rem, 10vw, 3.6rem); }
  .cat .ci img { width:100%; height:100%; object-fit:cover; display:block; }
  .cat .cl { display:block; padding:16px 8px 18px; font-size:clamp(1rem, 3.4vw, 1.25rem); }
  .filterbar { display:flex; justify-content:center; margin:0 0 20px; }
  .filterbar[hidden] { display:none; }
  .chip { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 16px; }
  .chip button { border:0; background:var(--hero); color:#111; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:14px; line-height:1; }
  body.searching .cats, body.searching .sub { display:none; }
  h1.results { font-size:clamp(1.4rem, 5vw, 2rem); overflow-wrap:anywhere; }
  body.cat-view .hero, body.cat-view .cats, body.cat-view .sub { display:none; }
  .hero.searching .promo, .hero.searching .carousel { display:none; }
  .wave { display:block; width:100%; height:40px; margin:8px 0 -1px; }
  .wave path { fill:var(--bg); }
  .empty { text-align:center; color:var(--muted); margin-top:24px; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <form class="search" id="searchForm" role="search">
      <button type="submit" class="sbtn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg></button>
      <input id="q" type="search" placeholder='Search for "Brand Name"' aria-label="Search brands" autocomplete="off">
    </form>

    <div class="promo" role="img" aria-label="Mega Diwali Scheme">
      <svg viewBox="0 0 720 197" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#e2a82e"/><stop offset="1" stop-color="#a86a14"/></linearGradient>
          <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a2b"/><stop offset="1" stop-color="#9a5a12"/></linearGradient>
          <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
          <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fae"/><stop offset="1" stop-color="#b3156b"/></linearGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <path id="star" d="M0-10L2.5-2.5L10 0L2.5 2.5L0 10L-2.5 2.5L-10 0L-2.5-2.5Z"/>
          <path id="badge" d="M190 8C215 8 225 30 250 36C285 44 310 38 330 70C340 85 340 95 330 110C310 142 285 136 250 144C225 150 215 172 190 172C165 172 155 150 130 144C95 136 70 142 50 110C40 95 40 85 50 70C70 38 95 44 130 36C155 30 165 8 190 8Z"/>
          <g id="flower">
            <g fill="#8e2aa8">
              <ellipse cy="-14" rx="6.5" ry="14"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(45)"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(90)"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(135)"/>
              <ellipse cy="-14" rx="6.5" ry="14" transform="rotate(180)"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(225)"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(270)"/><ellipse cy="-14" rx="6.5" ry="14" transform="rotate(315)"/>
            </g>
            <g fill="#e8479f">
              <ellipse cy="-10" rx="4.5" ry="10" transform="rotate(22)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(67)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(112)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(157)"/>
              <ellipse cy="-10" rx="4.5" ry="10" transform="rotate(202)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(247)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(292)"/><ellipse cy="-10" rx="4.5" ry="10" transform="rotate(337)"/>
            </g>
            <circle r="4.5" fill="#fff"/>
          </g>
        </defs>

        <!-- glow, flowers and sparkles -->
        <circle cx="190" cy="100" r="95" fill="url(#glow)"/>
        <use href="#flower" x="58" y="98"/>
        <use href="#flower" x="322" y="98"/>
        <use href="#star" x="112" y="40" fill="#fff"/>
        <use href="#star" x="272" y="46" fill="#fff" transform="translate(272 46) scale(.7) translate(-272 -46)"/>
        <use href="#star" x="96" y="150" fill="#fff" transform="translate(96 150) scale(.6) translate(-96 -150)"/>
        <use href="#star" x="288" y="146" fill="#fff" transform="translate(288 146) scale(.8) translate(-288 -146)"/>

        <!-- diya on a gold plate -->
        <g transform="translate(0 8)">
          <ellipse cx="190" cy="168" rx="98" ry="12" fill="url(#plate)"/>
          <ellipse cx="190" cy="165" rx="84" ry="8" fill="#e8a64a"/>
          <path d="M120 118C120 150 150 166 190 166C230 166 260 150 260 118Z" fill="url(#bowl)"/>
          <path d="M136 132C160 154 220 154 244 132" fill="none" stroke="#ffc2e0" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="190" cy="118" rx="70" ry="14" fill="#fff"/>
          <ellipse cx="190" cy="119" rx="61" ry="9" fill="#a8156a"/>
          <path d="M190 40C205 62 222 72 222 94C222 110 208 120 190 120C172 120 158 110 158 94C158 72 175 62 190 40Z" fill="url(#flame)"/>
          <path d="M190 70C198 82 206 88 206 98C206 108 199 114 190 114C181 114 174 108 174 98C174 88 182 82 190 70Z" fill="#ffe680"/>
        </g>

        <!-- Mega Diwali Scheme badge -->
        <g transform="translate(355 8)">
          <use href="#badge" fill="none" stroke="#e8458b" stroke-width="3" transform="translate(190 90) scale(1.07) translate(-190 -90)"/>
          <use href="#badge" fill="#6b1359" stroke="#ff8a4c" stroke-width="5"/>
          <use href="#badge" fill="none" stroke="url(#gold)" stroke-width="2" transform="translate(190 90) scale(.9) translate(-190 -90)"/>
          <text x="190" y="58" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="17" letter-spacing="4" fill="url(#gold)">MEGA</text>
          <text x="190" y="108" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="56" fill="url(#gold)">Diwali</text>
          <text x="190" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="17" letter-spacing="4" fill="url(#gold)">SCHEME</text>
        </g>
      </svg>
    </div>

    <div class="carousel">
      <div class="vp">
        <button type="button" class="nav prev" id="prev" aria-label="Previous banner"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="track" id="track"></div>
        <button type="button" class="nav next" id="next" aria-label="Next banner"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30C200 70 350 0 600 10C800 18 900 40 1000 30L1000 60L0 60Z"/></svg>
</header>

<main>
  <section class="cats" id="cats" aria-label="Categories"></section>

  <h1 id="title">Our Brands</h1>
  <p class="sub">Quality Toys from trusted brands</p>

  <div class="filterbar" id="filterbar" hidden><div class="chip"><span id="chipName"></span><button type="button" id="clearCat" aria-label="Clear category filter">&#10005;</button></div></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No brands found.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // Used only if brands.xlsx cannot be loaded (e.g. page opened directly from disk).
  var FALLBACK = [
    {name:"Swing 'N' Fly", logo:"https://raw.githubusercontent.com/iemvinay-dev/brand_list/main/Logo_0.jpg", site:"https://zenmarketing.smartbiz.in/", keys:"Baby Walker, Swing N Fly, Swing and Fly"},
  ];
  var brands = [];
  var grid = document.getElementById("grid");
  var emptyMsg = document.getElementById("empty");
  var term = "";
  var cat = null;
  var filterbar = document.getElementById("filterbar"), chipName = document.getElementById("chipName");

  function norm(row) {
    var o = {};
    Object.keys(row).forEach(function(k){ o[k.toString().trim().toLowerCase()] = row[k]; });
    return {
      name: String(o["brand name"] || o["brand"] || o["name"] || "").trim(),
      logo: String(o["logo url"] || o["logo link"] || o["logo"] || "").trim(),
      site: String(o["website"] || o["link"] || o["url"] || "").trim(),
      keys: String(o["search keys"] || o["search key"] || o["keywords"] || o["keyword"] || o["tags"] || o["tag"] || "").trim()
    };
  }
  // Lower-case, drop apostrophes, turn other punctuation into spaces ("Swing 'N' Fly" -> "swing n fly")
  function clean(s) {
    return String(s || "").toLowerCase().replace(/['\u2019`]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }
  function prep(b) { b.hay = clean(b.name + " " + (b.keys || "")); return b; }
  function safeUrl(u) {
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { var p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : ""; } catch(e) { return ""; }
  }
  function parse(wb) {
    var ws = wb.Sheets[wb.SheetNames[0]];
    brands = XLSX.utils.sheet_to_json(ws, {defval:""}).map(norm).filter(function(b){ return b.name; }).map(prep);
    render();
  }
  function render() {
    grid.innerHTML = "";
    var searching = term !== "";
    document.querySelector(".hero").classList.toggle("searching", searching);
    document.body.classList.toggle("searching", searching);
    document.body.classList.toggle("cat-view", !!cat);
    if (searching || cat) { stop(); } else { start(); }
    filterbar.hidden = !cat;
    if (cat) chipName.textContent = "Showing: " + cat.label;
    var shown = brands.filter(function(b){
      if (b.hay.indexOf(term) < 0) return false;
      return !cat || cat.keys.some(function(k){ return b.hay.indexOf(k) > -1; });
    });
    emptyMsg.textContent = cat ? "No brands listed under " + cat.label + " yet." : (searching ? "Try a different word or brand name." : "No brands found.");
    emptyMsg.hidden = shown.length > 0;
    // Heading: show the search text instead of "Our Brands" while searching
    var titleEl = document.getElementById("title");
    if (searching) {
      var typed = document.getElementById("q").value.trim();
      titleEl.textContent = (shown.length ? "Results for \u201c" : "No results for \u201c") + typed + "\u201d";
    } else {
      titleEl.textContent = "Our Brands";
    }
    titleEl.classList.toggle("results", searching);
    shown.forEach(function(b) {
      var href = safeUrl(b.site);
      var el = document.createElement("button");
      el.type = "button"; el.className = "tile";
      var logo = document.createElement("div"); logo.className = "logo";
      var name = document.createElement("span"); name.className = "name"; name.textContent = b.name;
      var host = ""; try { host = new URL(href).hostname; } catch(e) {}
      var icon = host ? "https://www.google.com/s2/favicons?sz=128&domain=" + host : "";
      var src = b.logo || icon;
      if (src) {
        var img = document.createElement("img");
        img.src = src; img.alt = b.name + " logo"; img.loading = "lazy";
        img.onerror = function(){
          if (icon && img.src !== icon) { img.src = icon; } else { img.remove(); }
        };
        logo.appendChild(img);
      }
      logo.appendChild(name);
      var target = href || "https://www.google.com/search?q=" + encodeURIComponent(b.name + " bicycle official website");
      el.setAttribute("aria-label", "Open " + b.name);
      el.addEventListener("click", function(){ window.location.href = target; });
      el.appendChild(logo);
      grid.appendChild(el);
    });
  }

  fetch("brands.xlsx?v=" + Date.now(), {cache:"no-store"}).then(function(r){ if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(function(buf){ parse(XLSX.read(buf, {type:"array"})); })
    .catch(function(){ brands = FALLBACK.map(prep); render(); });

  // ---- Search bar ----
  var q = document.getElementById("q");
  q.addEventListener("input", function(){ term = clean(q.value); render(); });
  document.getElementById("searchForm").addEventListener("submit", function(e){
    e.preventDefault();
    term = clean(q.value);
    var btn = document.querySelector(".sbtn");
    if (!term) {
      // No text: blink the button and put the cursor in the box
      render();
      btn.classList.remove("blink");
      void btn.offsetWidth;
      btn.classList.add("blink");
      btn.addEventListener("animationend", function(){ btn.classList.remove("blink"); }, {once:true});
      q.focus();
      return;
    }
    render();
    q.blur();
    grid.scrollIntoView({behavior:"smooth", block:"start"});
  });

  // ---- Banner carousel ----
  // Add "img" (image URL) to any slide to show your own banner; without it a colored placeholder is shown.
  var BANNERS = [
    {title:"Cashback on Push Ride, Baby Walker & Electric Toys", tag:"Get upto 5% Cart Discount", bg:"linear-gradient(135deg,#ff7a3d,#d9381e)", link:"#", img:""},
    {title:"New Arrivals", tag:"Fresh toys just landed", bg:"linear-gradient(135deg,#7b5cff,#3b2bb3)", link:"#", img:""},
    {title:"Trusted Brands", tag:"Quality toys, every age", bg:"linear-gradient(135deg,#19b394,#0b6e5a)", link:"#", img:""}
  ];
  var track = document.getElementById("track"), dotsEl = document.getElementById("dots");
  var slideEls = [], dotEls = [], idx = 0, timer = null, PAD = 16;

  BANNERS.forEach(function(b, i){
    var a = document.createElement("div");
    a.className = "slide";
    if (b.img) {
      var im = document.createElement("img");
      im.src = b.img; im.alt = b.title; im.loading = "lazy";
      a.appendChild(im);
    } else {
      a.style.background = b.bg;
      var h = document.createElement("h2"); h.textContent = b.title;
      var p = document.createElement("p"); p.textContent = b.tag;
      a.appendChild(h); a.appendChild(p);
    }
    track.appendChild(a); slideEls.push(a);

    var d = document.createElement("button");
    d.type = "button"; d.className = "dot"; d.setAttribute("aria-label", "Go to banner " + (i + 1));
    d.addEventListener("click", function(){ go(i); });
    dotsEl.appendChild(d); dotEls.push(d);
  });

  function go(i) { track.scrollTo({left: slideEls[i].offsetLeft - PAD, behavior: "smooth"}); }
  function setActive() {
    var best = 0, dist = 1e9;
    slideEls.forEach(function(s, i){
      var d = Math.abs(s.offsetLeft - PAD - track.scrollLeft);
      if (d < dist) { dist = d; best = i; }
    });
    idx = best;
    dotEls.forEach(function(d, i){ d.classList.toggle("on", i === best); });
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function start() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    stop();
    timer = setInterval(function(){ go((idx + 1) % slideEls.length); }, 4000);
  }
  document.getElementById("prev").addEventListener("click", function(){
    go((idx - 1 + slideEls.length) % slideEls.length); start();
  });
  document.getElementById("next").addEventListener("click", function(){
    go((idx + 1) % slideEls.length); start();
  });
  track.addEventListener("scroll", setActive, {passive:true});
  track.addEventListener("mouseenter", stop);
  track.addEventListener("mouseleave", start);
  track.addEventListener("touchstart", stop, {passive:true});
  track.addEventListener("touchend", start, {passive:true});
  setActive(); start();

  // ---- Category tabs ----
  // Each tab shows the brands whose Search Keys contain one of its "keys".
  // Add an image URL in "img" to replace the emoji placeholder.
  var ICONS = {
    bike:    '<svg viewBox="0 0 48 32"><circle cx="10" cy="22" r="7"/><circle cx="38" cy="22" r="7"/><path d="M10 22L18 10H32L38 22M18 10L24 22L32 10M32 10L34 6H38M15 6H22"/></svg>'
  };
  var CATEGORIES = [
    {icon:"bike", title:"Tricycle, Electric Vehicle & Baby Walker", items:[
      {label:"Baby Walker", keys:["baby walker","rocker"], emoji:"\ud83d\udc76", bg:"linear-gradient(135deg,#f6d9c6,#f3b7c8)", img:"https://raw.githubusercontent.com/iemvinay-dev/brand_list/main/Icon_0.JPG", fit:"contain"}
    ]}
  ];
  var catsEl = document.getElementById("cats"), catBtns = [];

  function setCatUI() { catBtns.forEach(function(x){ x.el.classList.toggle("on", x.item === cat); }); }

  CATEGORIES.forEach(function(sec){
    var wrap = document.createElement("div"); wrap.className = "cat-sec";
    var h = document.createElement("h2"); h.className = "cat-title";
    h.innerHTML = ICONS[sec.icon] || "";
    var t = document.createElement("span"); t.textContent = sec.title; h.appendChild(t);
    var row = document.createElement("div"); row.className = "cat-row";
    sec.items.forEach(function(item){
      item.keys = item.keys.map(clean);
      var el = document.createElement("button");
      el.type = "button"; el.className = "cat";
      var ci = document.createElement("div"); ci.className = "ci";
      if (item.img) {
        var im = document.createElement("img"); im.src = item.img; im.alt = ""; im.loading = "lazy";
        if (item.fit) { im.style.objectFit = item.fit; ci.style.background = "#fff"; }
        im.onerror = function(){ im.remove(); ci.style.background = item.bg; ci.textContent = item.emoji; };
        ci.appendChild(im);
      } else { ci.style.background = item.bg; ci.textContent = item.emoji; }
      var cl = document.createElement("span"); cl.className = "cl"; cl.textContent = item.label;
      el.appendChild(ci); el.appendChild(cl);
      el.addEventListener("click", function(){
        cat = (cat === item) ? null : item;
        setCatUI(); render();
        window.scrollTo({top:0, behavior:"smooth"});
      });
      row.appendChild(el); catBtns.push({el:el, item:item});
    });
    wrap.appendChild(h); wrap.appendChild(row); catsEl.appendChild(wrap);
  });

  document.getElementById("clearCat").addEventListener("click", function(){ cat = null; setCatUI(); render(); window.scrollTo({top:0, behavior:"smooth"}); });
</script>
</body>
</html>
